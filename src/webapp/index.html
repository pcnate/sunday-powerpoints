<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday PowerPoints</title>
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    body { min-height: 100vh; }
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 300px;
      height: 100vh;
      border-left: 1px solid #dee2e6;
      padding: 2rem 0 1rem 1rem; /* Remove right padding, keep left */
      overflow-y: auto;
      box-shadow: -2px 0 8px rgba(0,0,0,0.03);
    }
    .main-content {
      margin-right: 320px;
      padding-left: 1rem;
      padding-right: 0; /* Remove right padding */
      padding-top: 0;
      padding-bottom: 0;
    }
    @media (max-width: 900px) {
      .sidebar { position: static; width: 100%; height: auto; border-left: none; box-shadow: none; padding-right: 0; }
      .main-content { margin-right: 0; padding-right: 0; }
    }
    #song-library-table-scroll {
      overflow: auto;
      border-radius: 6px;
      height: calc(100vh - 119px - 1rem);
      min-height: 120px;
      margin-bottom: 1rem;
      transition: height 0.2s;
    }
    @media (max-width: 900px) {
      #song-library-table-scroll {
        height: calc(100vh - 119px);
        margin-bottom: 0;
      }
    }
    #song-library-table-scroll table {
      margin-bottom: 0;
    }
    #song-library-table-scroll thead th {
      position: sticky;
      top: 0;
      z-index: 2;
    }
    /* Sticky tab bar and search row */
    #mainTab {
      position: sticky;
      top: 0;
      z-index: 20;
    }
    #song-library .row.mb-2 {
      position: sticky;
      top: 41px;
      z-index: 10;
      padding-top: 8px;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <ul class="nav nav-tabs mb-3 bg-body" id="mainTab" role="tablist" style="display:flex;align-items:center;">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="song-library-tab" data-bs-toggle="tab" data-bs-target="#song-library" type="button" role="tab" aria-controls="song-library" aria-selected="true">Song Library</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="upcoming-songs-tab" data-bs-toggle="tab" data-bs-target="#upcoming-songs" type="button" role="tab" aria-controls="upcoming-songs" aria-selected="false">Upcoming Songs</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab" aria-controls="admin" aria-selected="false">Admin</button>
      </li>
      <li class="ms-auto" style="margin-left:auto;">
        <select id="themeToggle" class="form-select form-select-sm" style="width:auto;min-width:120px;">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </li>
    </ul>
    <div class="tab-content" id="mainTabContent">
      <div class="tab-pane fade show active" id="song-library" role="tabpanel" aria-labelledby="song-library-tab">
        <div class="row mb-2 bg-body">
          <div class="col-md-4">
            <select id="songBookFilter" class="form-select">
              <option value="">All Books/Sources</option>
            </select>
          </div>
          <div class="col-md-4">
            <input id="songSearchInput" type="text" class="form-control" placeholder="Search by number or name...">
          </div>
          <div class="col-md-4 d-flex align-items-center">
            <span id="songResultCount" style="font-weight:bold;"></span>
          </div>
        </div>
        <div id="song-library-table-scroll" style="overflow:auto;border-radius:6px">
          <div id="song-library-table-container">
            <div class="text-center text-muted">Loading songs...</div>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="upcoming-songs" role="tabpanel" aria-labelledby="upcoming-songs-tab">
        <div class="mb-3 d-flex flex-wrap align-items-center gap-2">
          <label for="songMonthPicker" class="form-label mb-0">Select Month:</label>
          <select id="songMonthPicker" class="form-select" style="width:auto;"></select>
        </div>
        <div id="song-selection-weeks" class="row flex-wrap" style="gap:1rem;"></div>
        <div id="song-selection-status" class="mt-3"></div>
      </div>
      <div class="tab-pane fade" id="admin" role="tabpanel" aria-labelledby="admin-tab">
        <div id="template-card" class="mb-4"></div>
        <button class="btn btn-primary mb-3 me-2" id="foldersOnlyBtn" title="Opens popup to select which month to create folders for" data-bs-toggle="modal" data-bs-target="#runModal">Create Folders</button>
        <button class="btn btn-secondary mb-3" id="copyTemplateBtn" title="Opens popup to select which month to copy templete file into" data-bs-toggle="modal" data-bs-target="#runModal">Copy Template</button>
        <!-- Modal -->
        <div class="modal fade" id="runModal" tabindex="-1" aria-labelledby="runModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="runModalLabel">Create Folders for Sundays</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form id="runForm">
                  <div class="mb-3">
                    <label for="monthInput" class="form-label">Month</label>
                    <select class="form-select" id="monthInput" required>
                      <option value="1">January</option>
                      <option value="2">February</option>
                      <option value="3">March</option>
                      <option value="4">April</option>
                      <option value="5">May</option>
                      <option value="6">June</option>
                      <option value="7">July</option>
                      <option value="8">August</option>
                      <option value="9">September</option>
                      <option value="10">October</option>
                      <option value="11">November</option>
                      <option value="12">December</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="yearInput" class="form-label">Year</label>
                    <input type="number" class="form-control" id="yearInput" min="2000" max="2100" required>
                  </div>
                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="writeInput">
                    <label class="form-check-label" for="writeInput">Write (actually create folders/files)</label>
                  </div>
                  <button type="submit" class="btn btn-success">Run</button>
                </form>
                <div id="runResult" class="mt-3"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="sidebar bg-body">
    <h5 class="mb-3">Output Folders</h5>
    <ul id="folder-list" class="list-group"></ul>
  </div>

  <!-- Notes Modal -->
  <div class="modal fade" id="notesModal" tabindex="-1" aria-labelledby="notesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="notesModalLabel">Notes for <span id="notesModalDate"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <textarea id="notesModalText" class="form-control" rows="12" style="font-family:monospace;"></textarea>
          <div id="notesModalStatus" class="mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="notesModalSaveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fetch template file details and show in a Bootstrap card
    function fetchAndRenderTemplateInfo() {
      fetch('/api/template-info')
        .then(res => res.json())
        .then(info => {
          const card = document.getElementById('template-card');
          if (!info || info.error) {
            card.innerHTML = `<div class="alert alert-warning">Template file not found.</div>`;
          } else {
            card.innerHTML = `
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title mb-2">Template File</h5>
                  <p class="card-text mb-1"><strong>Name:</strong> ${info.name}</p>
                  <p class="card-text mb-1"><strong>Last Modified:</strong> ${info.lastModified}</p>
                  <p class="card-text mb-0"><strong>Size:</strong> ${info.size}</p>
                </div>
              </div>
            `;
          }
        });
    }
    fetchAndRenderTemplateInfo();
    setInterval(fetchAndRenderTemplateInfo, 10000);

    document.addEventListener('DOMContentLoaded', function() {
      // Set default month/year for the modal
      const now = new Date();
      let defaultMonth = now.getMonth() + 1; // JS months are 0-based
      let defaultYear = now.getFullYear();
      if (now.getDate() >= 16) {
        if (defaultMonth === 12) {
          defaultMonth = 1;
          defaultYear++;
        } else {
          defaultMonth++;
        }
      }
      document.getElementById('monthInput').value = defaultMonth;
      document.getElementById('yearInput').value = defaultYear;

      const runForm = document.getElementById('runForm');
      let foldersOnlyMode = !0; // default to folders-only
      // Button event listeners to set mode and reset modal
      document.getElementById('foldersOnlyBtn').addEventListener('click', function() {
        foldersOnlyMode = !0;
        document.getElementById('runModalLabel').textContent = 'Create Folders for Sundays';
        // Reset modal state
        runForm.reset();
        document.getElementById('runResult').innerHTML = '';
        document.getElementById('monthInput').value = defaultMonth;
        document.getElementById('yearInput').value = defaultYear;
        runForm.setAttribute('data-endpoint', '/api/run-folders');
      });
      document.getElementById('copyTemplateBtn').addEventListener('click', function() {
        foldersOnlyMode = false;
        document.getElementById('runModalLabel').textContent = 'Copy Template for Sundays';
        // Reset modal state
        runForm.reset();
        document.getElementById('runResult').innerHTML = '';
        document.getElementById('monthInput').value = defaultMonth;
        document.getElementById('yearInput').value = defaultYear;
        runForm.setAttribute('data-endpoint', '/api/copy-template');
      });
      if (runForm) {
        runForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          const month = document.getElementById('monthInput').value;
          const year = document.getElementById('yearInput').value;
          const write = document.getElementById('writeInput').checked;
          const resultDiv = document.getElementById('runResult');
          resultDiv.innerHTML = '<div class="text-info">Running...</div>';
          try {
            const endpoint = runForm.getAttribute('data-endpoint') || '/api/run-folders';
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ month, year, write })
            });
            const data = await res.json();
            if (data.success) {
              resultDiv.innerHTML = `<pre class="alert alert-success">${data.message || 'Folders created successfully.'}</pre>`;
            } else {
              resultDiv.innerHTML = `<pre class="alert alert-danger">${data.error || 'An error occurred.'}</pre>`;
            }
            // Refresh sidebar after completion
            fetchAndRenderFolders();
            fetchAndRenderTemplateInfo();
          } catch (err) {
            resultDiv.innerHTML = `<div class="alert alert-danger">Request failed.</div>`;
          }
        });
      }
    });

    /**
     * Utility function to create an icon with tooltip
     * 
     * @param {boolean} flag - Whether the item is present
     * @param {string} yesLabel - Tooltip text when present
     * @param {string} yesIcon - HTML for the icon when present
     * @param {string} noLabel - Tooltip text when not present
     * @param {string} noIcon - HTML for the icon when not present
     * @return {string} HTML string for the icon element
     */
    function icon( flag, yesLabel, yesIcon, noLabel, noIcon ) {
      return `<span title="${ flag ? yesLabel : noLabel }" style="margin-right:6px;">${ flag ? yesIcon : noIcon }</span>`;
    }
    function renderFolderList(folders) {
      const list = document.getElementById('folder-list');
      // Build a map of current DOM items by folder name
      const existingItems = {};
      Array.from(list.children).forEach(li => {
        const folderName = li.getAttribute('data-folder');
        if (folderName) existingItems[folderName] = li;
      });

      // Track folders that are still present
      const foldersSeen = new Set();

      // Insert/update items in sorted order (newest first)
      folders.forEach( folder => {
        const isDateFolder = /^\d{8}$/.test( folder.name ) || /^\d{4}-\d{2}-\d{2}$/.test( folder.name );
        if (!isDateFolder) return;
        foldersSeen.add( folder.name );
        let li = existingItems[ folder.name ];
        let html = `<div class=\"flex-grow-1 d-flex align-items-center\">`;
        html += `<strong>${ folder.name }</strong>`;
        html += `<span class="ms-2" style="font-size:1.2em; margin-top:-2px">`;

        html += icon( folder.hasFile,
          `PowerPoint file present. This is the main presentation file for this Sunday`,
          `<i class='fa fa-file-powerpoint-o' style='color:#d24726;font-size:0.8em;opacity:1;margin-right:2px'></i>`,
          `No PowerPoint file. This Sunday does not have a presentation file yet`,
          `<i class='fa fa-file-powerpoint-o' style='color:#d24726;font-size:0.8em;opacity:0.3;margin-right:2px'></i>`
        );
        html += icon( folder.hasMp4,
          `MP4 video present in Vids/. This is a video recording of the sermon`,
          `<i class='fa fa-film' style='color:green;font-size:0.8em;opacity:1;margin-right:2px;padding-left:5px;'></i>`,
          `No MP4 video. No video recording found for this Sunday`,
          `<i class='fa fa-film' style='color:#444;font-size:0.8em;opacity:0.3;margin-right:2px;padding-left:5px;'></i>`
        );

        html += icon( folder.hasNotes,
          `Notes text file present. This file contains notes or Bible verses for this Sunday`,
          `<i class='fa fa-sticky-note notes-icon' data-folder=\"${ folder.name }\" style='color:#007bff;font-size:0.8em;opacity:1;margin-right:2px;padding-left:5px;cursor:pointer;'></i>`,
          `No notes text file. No notes or Bible verses file found for this Sunday`,
          `<i class='fa fa-sticky-note' style='color:#007bff;font-size:0.8em;opacity:0.3;margin-right:2px;padding-left:5px;'></i>`,
        );

        // song 1-3 with a check or x icon if they exist
        if ( !folder.hasMp4 ) {
          html += icon( folder.hasSong1,
            'Song 1 present', '<i class="fa fa-check" style="color:green;"></i>',
            'Song 1 missing', '<i class="fa fa-times" style="color:#d24726;"></i>'
          );
          html += icon( folder.hasSong2,
            'Song 2 present', '<i class="fa fa-check" style="color:green;"></i>',
            'Song 2 missing', '<i class="fa fa-times" style="color:#d24726;"></i>'
          );
          html += icon( folder.hasSong3,
            'Song 3 present', '<i class="fa fa-check" style="color:green;"></i>',
            'Song 3 missing', '<i class="fa fa-times" style="color:#d24726;"></i>'
          );
        }

        html += `</span>`;
        html += `</div>`;
        if ( !!folder.hasMp4 && ( folder?.thumbnail || '' ).trim() !== '' ) {
          html += `<img title="${ folder.videoFileName }" src="${ folder.thumbnail }" alt="thumbnail" style="height:40px;width:auto;margin-left:10px;border-radius:4px;border:1px solid #ccc;object-fit:cover;">`;
        }

        if ( !li ) { // Create new item
          li = document.createElement('li');
          li.className = 'list-group-item d-flex align-items-center';
          li.setAttribute( 'data-folder', folder.name );
          li.innerHTML = html;
          // Insert in correct position (sorted by folders array order)
          let inserted = false;
          for ( let i = 0; i < list.children.length; i++ ) {
            const other = list.children[i];
            const otherName = other.getAttribute('data-folder');
            if ( otherName && folders.findIndex( f => f.name === folder.name ) < folders.findIndex( f => f.name === otherName ) ) {
              list.insertBefore( li, other );
              inserted = !0;
              break;
            }
          }
          if ( !inserted ) list.appendChild( li );
        } else { // Update existing item if changed
          if ( li.innerHTML !== html ) li.innerHTML = html;
        }
      });

      // Remove items not in the new folder list
      Object.keys(existingItems).forEach(folderName => {
        if (!foldersSeen.has(folderName)) {
          list.removeChild(existingItems[folderName]);
        }
      });

      // Add click event for notes icons
      setTimeout(() => {
        document.querySelectorAll('.notes-icon').forEach(icon => {
          icon.addEventListener('click', function(e) {
            const folder = this.getAttribute('data-folder');
            openNotesModal(folder);
          });
        });
      }, 0);
      if (!folders.some(folder => /^\d{8}$/.test(folder.name) || /^\d{4}-\d{2}-\d{2}$/.test(folder.name))) {
        list.innerHTML = '<li class="list-group-item">No folders found.</li>';
      }
    }

    function fetchAndRenderFolders() {
      fetch('/api/folders')
        .then(res => res.json())
        .then(renderFolderList);
    }

    // Initial fetch
    fetchAndRenderFolders();
    // Refresh every 10 seconds
    setInterval(fetchAndRenderFolders, 10000);

    // Open notes modal and fetch notes text
    function openNotesModal(folderName) {
      document.getElementById('notesModalDate').textContent = folderName;
      document.getElementById('notesModalText').value = '';
      document.getElementById('notesModalStatus').innerHTML = '';

      const elementFriendlyName = `notes-${ folderName.replace(/[^a-z0-9]/gi, '-') }`;
      const modalID = `notesModal`;

      // check if an existing modal for this folder is already open
      let notesModalElement = document.getElementById(modalID);

      // Create a new modal element if it doesn't exist
      if ( !notesModalElement ) {
        const newModalEl = document.createElement('div');
        newModalEl.id = modalID;
        newModalEl.className = elementFriendlyName;
        document.body.appendChild(newModalEl);
        notesModalElement = newModalEl;
      } else {
        notesModalElement.classList.forEach( c => c.startsWith('notes-') ? notesModalElement.classList.remove( c ) : !0 );
        notesModalElement.classList.add( elementFriendlyName );
      }

      // cr
      const modal = new bootstrap.Modal( notesModalElement );
      modal.show();
      fetch(`/api/notes?folder=${encodeURIComponent(folderName)}`)
        .then(res => res.ok ? res.text() : Promise.reject('Not found'))
        .then(text => {
          document.getElementById('notesModalText').value = text;
        })
        .catch(() => {
          document.getElementById('notesModalText').value = '';
          document.getElementById('notesModalStatus').innerHTML = '<div class="alert alert-danger">Could not load notes file.</div>';
        });
      // Save handler
      document.getElementById('notesModalSaveBtn').onclick = function() {
        const newText = document.getElementById('notesModalText').value;
        document.getElementById('notesModalStatus').innerHTML = '<span class="text-info">Saving...</span>';
        fetch(`/api/notes?folder=${encodeURIComponent(folderName)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: newText
        })
        .then(res => res.ok ? res.text() : Promise.reject('Save failed'))
        .then(() => {
          document.getElementById('notesModalStatus').innerHTML = '<span class="text-success">Saved!</span>';
        })
        .catch(() => {
          document.getElementById('notesModalStatus').innerHTML = '<span class="text-danger">Save failed.</span>';
        });
      };
    }

    // SONG LIBRARY TAB: Fetch and render songs table
    let allSongs = [];
    function renderSongsTable(songs) {
      // Add sortable headers
      let html = `<table class='table table-striped table-bordered' id='songTable'><thead><tr>` +
        `<th class='sortable' data-sort='number'>Song Number</th>` +
        `<th class='sortable' data-sort='name'>Song Name</th>` +
        `<th class='sortable' data-sort='book'>Book/Source</th>` +
        `<th class='sortable' data-sort='lastModified'>Last Modified</th>` +
        `</tr></thead><tbody>`;
      songs.forEach(song => {
        html += `<tr><td>${song.number || ''}</td><td>${song.name}</td><td>${song.book || ''}</td><td>${song.lastModified || ''}</td></tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('song-library-table-container').innerHTML = html;

      // Add sorting logic
      const table = document.getElementById('songTable');
      let sortState = renderSongsTable.sortState || { key: null, asc: !0 };
      const getCellValue = (tr, idx) => tr.children[idx].textContent || '';
      const compare = (a, b, type) => {
        if (type === 'number') {
          const na = parseInt(a) || 0, nb = parseInt(b) || 0;
          return na - nb;
        } else if (type === 'lastModified') {
          // Try to parse as date
          return new Date(a) - new Date(b);
        } else {
          return a.localeCompare(b);
        }
      };
      table.querySelectorAll('th.sortable').forEach((th, idx) => {
        th.style.cursor = 'pointer';
        th.onclick = function() {
          const key = th.getAttribute('data-sort');
          const type = key === 'number' ? 'number' : (key === 'lastModified' ? 'lastModified' : 'string');
          const tbody = table.querySelector('tbody');
          const rows = Array.from(tbody.querySelectorAll('tr'));
          const colIdx = idx;
          const asc = sortState.key === key ? !sortState.asc : !0;
          rows.sort((a, b) => {
            const va = getCellValue(a, colIdx);
            const vb = getCellValue(b, colIdx);
            return asc ? compare(va, vb, type) : compare(vb, va, type);
          });
          rows.forEach(row => tbody.appendChild(row));
          // Update sort state and add sort indicator
          sortState = { key, asc };
          renderSongsTable.sortState = sortState;
          table.querySelectorAll('th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
          th.classList.add(asc ? 'sorted-asc' : 'sorted-desc');
        };
      });
      // Add sort indicator CSS
      if (!document.getElementById('sortableTableStyle')) {
        const style = document.createElement('style');
        style.id = 'sortableTableStyle';
        style.textContent = `
          th.sortable.sorted-asc:after { content: " ▲"; }
          th.sortable.sorted-desc:after { content: " ▼"; }
        `;
        document.head.appendChild(style);
      }
    }
    function updateSongBookFilter(songs) {
      const select = document.getElementById('songBookFilter');
      // Count songs by book/source, but exclude any with book 'files', 'songtemplate.pptx', or any book that matches a file (not a folder)
      const bookCounts = {};
      songs.forEach(s => {
        if (
          s.book &&
          s.book.toLowerCase() !== 'files' &&
          s.book.toLowerCase() !== 'songtemplate.pptx' &&
          s.book.toLowerCase() !== 'new song captures' &&
          !s.book.toLowerCase().endsWith('.pptx') &&
          !s.book.toLowerCase().endsWith('.txt') &&
          !s.book.toLowerCase().endsWith('.pdf') &&
          !s.book.toLowerCase().includes('.') // crude: skip any book with a dot (likely a file)
        ) {
          bookCounts[s.book] = (bookCounts[s.book] || 0) + 1;
        }
      });
      const books = Object.keys(bookCounts).sort();
      select.innerHTML = '<option value="">All Books/Sources (' + songs.length + ')</option>' +
        books.map(b => `<option value="${b}">${b} (${bookCounts[b]})</option>`).join('');
    }
    function filterAndRenderSongs() {
      let book = document.getElementById('songBookFilter').value;
      const search = document.getElementById('songSearchInput').value.trim().toLowerCase();
      let filtered = allSongs;
      // Robustly exclude template song regardless of backend parsing
      filtered = filtered.filter(s => {
        const num = (s.number || '').toString().trim();
        const name = (s.name || '').toLowerCase();
        const filename = (s.filename || '').toLowerCase();
        // Exclude if number is '000', or name/filename contains both '000' and 'template', or name is 'song template'
        if (num === '000') return false;
        if (name === 'song template') return false;
        if ((name.includes('000') && name.includes('template')) || (filename.includes('000') && filename.includes('template'))) return false;
        return !0;
      });
      if (book) filtered = filtered.filter(s => s.book === book);
      if (search) {
        filtered = filtered.filter(s =>
          (s.number && s.number.includes(search)) ||
          (s.name && s.name.toLowerCase().includes(search))
        );
      }
      renderSongsTable(filtered);
      // Show count of results in the right column
      let countSpan = document.getElementById('songResultCount');
      if (countSpan) {
        countSpan.textContent = `Results: ${filtered.length}`;
      }
    }
    function fetchAndRenderSongs() {
      const container = document.getElementById('song-library-table-container');
      container.innerHTML = `<div class='text-center text-muted'>Loading songs...</div>`;
      fetch('/api/songs')
        .then(res => res.json())
        .then(data => {
          if (!Array.isArray(data)) {
            container.innerHTML = `<div class='alert alert-danger'>${data.error || 'Failed to load songs.'}</div>`;
            return;
          }
          allSongs = data;
          updateSongBookFilter(allSongs);
          filterAndRenderSongs();
        })
        .catch(() => {
          container.innerHTML = `<div class='alert alert-danger'>Failed to load songs.</div>`;
        });
    }
    document.getElementById('songBookFilter').addEventListener('change', filterAndRenderSongs);
    document.getElementById('songSearchInput').addEventListener('input', filterAndRenderSongs);
    document.getElementById('song-library-tab').addEventListener('shown.bs.tab', fetchAndRenderSongs);
    if (document.getElementById('song-library').classList.contains('show') && document.getElementById('song-library').classList.contains('active')) {
      fetchAndRenderSongs();
    }
  </script>
  <script>
    // THEME TOGGLE LOGIC
    (function() {
      const themeSelect = document.getElementById('themeToggle');
      // Load saved theme or default to system
      function getSavedTheme() {
        return localStorage.getItem('theme-mode') || 'system';
      }
      function getSystemTheme() {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        const html = document.documentElement;
        if (theme === 'light' || theme === 'dark') {
          html.setAttribute('data-bs-theme', theme);
        } else {
          // system: set to current system theme
          html.setAttribute('data-bs-theme', getSystemTheme());
        }
      }
      function setTheme(theme) {
        localStorage.setItem('theme-mode', theme);
        applyTheme(theme);
      }
      // On load
      const saved = getSavedTheme();
      themeSelect.value = saved;
      applyTheme(saved);
      // On change
      themeSelect.addEventListener('change', function() {
        setTheme(this.value);
      });
      // Listen for system theme changes if in system mode
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
          if (getSavedTheme() === 'system') applyTheme('system');
        });
      }
    })();
  </script>
  <script>
    // DEV MODE: Hot reload if webapp files change
    (function() {
      // Only run in dev mode (served from localhost or 127.0.0.1)
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        // Add a reload overlay element
        const reloadDiv = document.createElement('div');
        reloadDiv.id = 'hot-reload-overlay';
        reloadDiv.style.cssText = 'display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.35);color:#fff;font-size:2rem;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(2px);transition:opacity 0.2s;';
        reloadDiv.innerHTML = '<div style="margin:auto;padding:2em 2em;background:rgba(30,30,30,0.85);border-radius:12px;box-shadow:0 2px 16px #0008;display:inline-block;">Webapp updated!<br><span style="font-size:1.2rem;">Refreshing...</span></div>';
        reloadDiv.style.pointerEvents = 'none';
        reloadDiv.style.display = 'flex';
        reloadDiv.style.opacity = '0';
        document.body.appendChild(reloadDiv);
        let lastMod = null;
        setInterval(() => {
          fetch('/api/webapp-last-modified')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
              if (!data || !data.lastModified) return;
              if (!lastMod) {
                lastMod = data.lastModified;
              } else if (data.lastModified > lastMod) {
                // Show overlay, then reload after 1s
                reloadDiv.style.display = 'flex';
                setTimeout(() => { reloadDiv.style.opacity = '1'; }, 10);
                setTimeout(() => { location.reload(); }, 1000);
              }
            })
            .catch(() => {});
        }, 1000);
      }
    })();
  </script>

  <script>
    // SPA-style tab navigation: update URL hash and restore tab on load/back/forward
    function setTabFromHash() {
      const hash = location.hash.replace('#', '');
      if (!hash) return;
      const tabBtn = document.querySelector(`[data-bs-target="#${hash}"]`);
      if (tabBtn) {
        // Use Bootstrap's tab API to show the tab
        const tab = new bootstrap.Tab(tabBtn);
        tab.show();
      }
    }
    // On tab change, update the URL hash
    document.querySelectorAll('#mainTab button[data-bs-toggle="tab"]').forEach(btn => {
      btn.addEventListener('shown.bs.tab', function(e) {
        const target = this.getAttribute('data-bs-target');
        if (target && target.startsWith('#')) {
          history.replaceState(null, '', target);
        }
      });
    });
    // On page load, set tab from hash
    window.addEventListener('DOMContentLoaded', setTabFromHash);
    // On back/forward navigation, update tab
    window.addEventListener('popstate', setTabFromHash);
  </script>
  <script>
    // --- SONG SELECTION BY WEEK/MONTH LOGIC ---
    // Helper: get all Sundays in a month
    function getSundaysInMonth(year, month) {
      const sundays = [];
      const date = new Date(year, month - 1, 1);
      while (date.getMonth() === month - 1) {
        if (date.getDay() === 0) sundays.push(new Date(date));
        date.setDate(date.getDate() + 1);
      }
      return sundays;
    }
    // Helper: get month options (last 2, current, next 6)
    function getMonthOptions() {
      const now = new Date();
      let baseMonth = now.getMonth() + 1;
      let baseYear = now.getFullYear();
      // If after 15th, default to next month
      let defaultMonth = baseMonth;
      let defaultYear = baseYear;
      if (now.getDate() > 15) {
        if (baseMonth === 12) {
          defaultMonth = 1;
          defaultYear++;
        } else {
          defaultMonth++;
        }
      }
      const options = [];
      // Last 2 months
      for (let i = -2; i <= 6; i++) {
        let m = baseMonth + i;
        let y = baseYear;
        while (m < 1) { m += 12; y--; }
        while (m > 12) { m -= 12; y++; }
        options.push({
          value: `${y}-${String(m).padStart(2, '0')}`,
          label: `${new Date(y, m - 1).toLocaleString(undefined, { month: 'long', year: 'numeric' })}`,
          isDefault: (m === defaultMonth && y === defaultYear)
        });
      }
      return options;
    }
    // Render month dropdown
    function renderMonthDropdown() {
      const select = document.getElementById('songMonthPicker');
      const options = getMonthOptions();
      select.innerHTML = options.map(opt => `<option value="${opt.value}"${opt.isDefault ? ' selected' : ''}>${opt.label}</option>`).join('');
    }
    // Render week columns for selected month
    function renderSongSelectionWeeks(year, month) {
      const sundays = getSundaysInMonth(year, month);
      const container = document.getElementById('song-selection-weeks');
      container.innerHTML = '';
      sundays.forEach((sunday, weekIdx) => {
        const weekNumber = weekIdx + 1;
        const col = document.createElement('div');
        col.className = 'col border rounded p-2 bg-body-tertiary mb-3';
        col.style.minWidth = '260px';
        col.style.maxWidth = '280px';
        col.style.flex = '1 1 260px';
        col.innerHTML = `
          <div class="fw-bold mb-2">Week ${weekNumber} &mdash; ${sunday.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</div>
          <div class="mb-2">Choruses:
            <div id="chorus-list-${weekIdx}"></div>
            <button class="btn btn-sm btn-outline-primary mt-1" type="button" id="add-chorus-btn-${weekIdx}">+ Add Chorus</button>
          </div>
          <div class="mb-2">Songs:
            <div class="d-grid gap-2" id="song-list-${weekIdx}">
              <button class="btn btn-outline-secondary" type="button" id="song-btn-${weekIdx}-1">Choose Song 1</button>
              <button class="btn btn-outline-secondary" type="button" id="song-btn-${weekIdx}-2">Choose Song 2</button>
              <button class="btn btn-outline-secondary" type="button" id="song-btn-${weekIdx}-3">Choose Song 3</button>
            </div>
          </div>
          <div id="week-status-${weekIdx}" class="mt-1"></div>
        `;
        container.appendChild(col);
      });
      // Attach modal open handlers for all song/chorus buttons
      sundays.forEach((_, weekIdx) => {
        document.getElementById(`add-chorus-btn-${weekIdx}`).onclick = () => openSongSelectModal(weekIdx, 'chorus');
        for (let i = 1; i <= 3; i++) {
          document.getElementById(`song-btn-${weekIdx}-${i}`).onclick = () => openSongSelectModal(weekIdx, i);
        }
      });
    }

    // Fetch and render existing song/chorus selections for a given month
    async function fetchAndApplyWeekSelections(year, month) {
      try {
        const res = await fetch(`/api/week-song-selections?year=${year}&month=${month}`);
        if (!res.ok) return;
        const data = await res.json();
        // data: { [weekIdx]: { songs: [song1, song2, song3], choruses: [chorus1, ...] } }
        Object.entries(data).forEach(([weekIdx, weekData]) => {
          // Set songs
          if (weekData.songs) {
            weekData.songs.forEach((song, i) => {
              const btn = document.getElementById(`song-btn-${weekIdx}-${i+1}`);
              if (btn && song) {
                btn.textContent = songLabel(song);
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-success');
                // set button tooltip
                btn.setAttribute('title', `${ songLabel( song ) }`);
              }
            });
          }
          // Set choruses
          if (weekData.choruses) {
            const chorusList = document.getElementById(`chorus-list-${weekIdx}`);
            if (chorusList) {
              chorusList.innerHTML = '';
              weekData.choruses.forEach((chorus, chorusIdx) => {
                const div = createSongBadge(chorus);
                chorusList.appendChild(div);
                div.querySelector('.chorus-delete-btn').onclick = function() {
                  div.remove();
                  postChorusList(weekIdx);
                };
              });
            }
          }
        });
      } catch (e) { /* ignore */ }
    }

    // --- Song/Chorus Selection Modal ---
    // Modal HTML (insert at end of body if not present)
    function ensureSongSelectModal() {
      if (document.getElementById('songSelectModal')) return;
      const modal = document.createElement('div');
      modal.innerHTML = `
        <div class="modal fade" id="songSelectModal" tabindex="-1" aria-labelledby="songSelectModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="songSelectModalLabel">Select Song</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div class="row mb-2">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <input id="songSelectSearch" type="text" class="form-control" placeholder="Search by number or name...">
                  </div>
                  <div class="col-md-6">
                    <select id="songSelectBookFilter" class="form-select">
                      <option value="">All Books/Sources</option>
                    </select>
                  </div>
                </div>
                <div id="songSelectTableContainer" style="max-height:50vh;overflow:auto;"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    // Helper: filter out template and invalid songs for modal
    function getFilteredSongsForModal() {
      return allSongs.filter(s => {
        const num = (s.number || '').toString().trim();
        const name = (s.name || '').toLowerCase();
        const filename = (s.filename || '').toLowerCase();
        const book = (s.book || '').toLowerCase();
        if (num === '000') return false;
        if (name === 'song template') return false;
        if ((name.includes('000') && name.includes('template')) || (filename.includes('000') && filename.includes('template'))) return false;
        if (filename === 'song template.pptx' || name === 'song template.pptx' || book === 'songtemplate.pptx') return false;
        return !0;
      });
    }

    // Helper: get unique books for dropdown
    function getBooksForModal(songs) {
      const books = new Set();
      songs.forEach(s => {
        if (s.book && s.book.toLowerCase() !== 'files' && s.book.toLowerCase() !== 'songtemplate.pptx' && !s.book.toLowerCase().endsWith('.pptx') && !s.book.toLowerCase().endsWith('.txt') && !s.book.toLowerCase().endsWith('.pdf') && !s.book.toLowerCase().includes('.')) {
          books.add(s.book);
        }
      });
      return Array.from(books).sort();
    }

    // Open modal and render song list for selection
    let songSelectModalInstance = null;
    let songSelectCallback = null;
    function openSongSelectModal(weekIdx, slot) {
      ensureSongSelectModal();
      const modalEl = document.getElementById('songSelectModal');
      if (!songSelectModalInstance) songSelectModalInstance = new bootstrap.Modal(modalEl);
      document.getElementById('songSelectModalLabel').textContent = slot === 'chorus' ? 'Select Chorus' : `Select Song ${slot}`;
      let modalSongs = getFilteredSongsForModal();
      const bookSelect = document.getElementById('songSelectBookFilter');
      const books = getBooksForModal(modalSongs);
      bookSelect.innerHTML = '<option value="">All Books/Sources</option>' + books.map(b => `<option value="${b}">${b}</option>`).join('');
      // Restore last selected book filter from localStorage
      const lastBook = localStorage.getItem('songSelectBookFilter');
      if (lastBook && books.includes(lastBook)) bookSelect.value = lastBook;
      // Render table with filter applied if needed
      const searchInput = document.getElementById('songSelectSearch');
      searchInput.value = '';
      function filterModalSongs() {
        const q = searchInput.value.trim().toLowerCase();
        const book = bookSelect.value;
        let filtered = modalSongs;
        if (book) filtered = filtered.filter(s => s.book === book);
        if (q) filtered = filtered.filter(s =>
          (s.number && s.number.toLowerCase().includes(q)) ||
          (s.name && s.name.toLowerCase().includes(q))
        );
        renderSongSelectTable(filtered, weekIdx, slot);
      }
      // Apply filter immediately if a book is remembered
      filterModalSongs();
      searchInput.oninput = filterModalSongs;
      bookSelect.onchange = function() {
        localStorage.setItem('songSelectBookFilter', bookSelect.value);
        filterModalSongs();
      };
      songSelectModalInstance.show();
      songSelectCallback = (song) => {
        songSelectModalInstance.hide();
        handleSongChosen(weekIdx, slot, song);
      };
    }

    function renderSongSelectTable(songs, weekIdx, slot) {
      const container = document.getElementById('songSelectTableContainer');
      let html = `<table class='table table-sm table-hover'><thead><tr><th>Number</th><th>Name</th><th>Book</th><th></th></tr></thead><tbody>`;
      songs.forEach(song => {
        const num = song.number ? `#${song.number}` : '';
        html += `<tr><td>${num}</td><td>${song.name}</td><td>${song.book || ''}</td><td><button class='btn btn-primary btn-sm' type='button' data-songnum='${song.number || ''}' data-songname='${encodeURIComponent(song.name)}'>Select</button></td></tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
      // Attach select handlers
      container.querySelectorAll('button[data-songnum]').forEach(btn => {
        btn.onclick = function() {
          const num = this.getAttribute('data-songnum');
          const name = decodeURIComponent(this.getAttribute('data-songname'));
          const song = allSongs.find(s => s.number == num && s.name == name) || { number: num, name };
          if (songSelectCallback) songSelectCallback(song);
        };
      });
    }

    // Handle song/chorus chosen: update UI and POST to server (API to be implemented)
    function handleSongChosen(weekIdx, slot, song) {
      if (slot === 'chorus') {
        // Add chorus row to UI (with delete icon)
        const chorusList = document.getElementById(`chorus-list-${weekIdx}`);
        const div = createSongBadge( song );
        chorusList.appendChild(div);
        // Add delete handler
        div.querySelector('.chorus-delete-btn').onclick = function() {
          div.remove();
          postChorusList(weekIdx);
        };
        // POST updated chorus list
        postChorusList(weekIdx);
      } else {
        // Update button label
        const btn = document.getElementById(`song-btn-${weekIdx}-${slot}`);
        btn.textContent = songLabel(song);
        btn.classList.remove('btn-outline-secondary');
        btn.classList.add('btn-success');
        btn.setAttribute('title', `${ songLabel( song ) }`);
        // POST to server (to be implemented)
        // Compute the date string (YYYYMMDD) for this weekIdx and current month/year
        const [year, month] = document.getElementById('songMonthPicker').value.split('-').map(Number);
        const sundays = getSundaysInMonth(year, month);
        const sunday = sundays[weekIdx];
        let date = '';
        if (sunday) {
          date = `${sunday.getFullYear()}${String(sunday.getMonth()+1).padStart(2,'0')}${String(sunday.getDate()).padStart(2,'0')}`;
        }
        fetch('/api/update-song', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ weekIdx, slot, song, date })
        })
        .then(r => r.json())
        .then(data => {
          if (data && data.status) {
            if (data.status === 'already-correct') showSnackbar('Shortcut already correct.', 'secondary');
            else if (data.status === 'replaced') showSnackbar('Shortcut replaced.', 'warning');
            else if (data.status === 'created') showSnackbar('Shortcut created.', 'success');
            else if (data.status === 'not-found') showSnackbar('Song file not found in library.', 'danger');
            else if (data.status === 'error') showSnackbar('Error saving shortcut.', 'danger');
            else showSnackbar('Saved.', 'info');
          } else {
            showSnackbar('Saved.', 'info');
          }
        })
        .catch(() => showSnackbar('Error saving shortcut.', 'danger'));
      }
    }

    /**
     * create a badge element for choruses
     * 
     * @param {Object} song - The song object containing number, name, and book.
     * @returns {HTMLElement} - The badge element for the song.
     */
    function createSongBadge( song ) {
      const div = document.createElement( 'div' );
      div.className = 'mb-2 chorus-row'; // <-- Add chorus-row here
      // Tooltip: show full name, number, and book
      let tooltip = '';
      if (song.number) tooltip += `#${song.number} - `;
      tooltip += song.name || '';
      if (song.book) tooltip += `\nBook: ${song.book}`;
      div.innerHTML = `
          <span class="badge bg-info text-dark d-flex align-items-center justify-content-between w-100" style="font-size:1.08em; min-height:2.2em; padding:0.7em 1.2em 0.7em 1em; border-radius:0.5em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${tooltip.replace(/"/g, '&quot;')}">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0;">${songLabel(song)}</span>
            <button type="button" class="btn btn-sm btn-close chorus-delete-btn ms-2" title="Delete" style="filter:invert(0.7);opacity:0.9;flex:0 0 auto;"></button>
          </span>
        `;
      // Store song data for later POST
      div.dataset.songnum = song.number || '';
      div.dataset.songname = song.name;
      div.dataset.songbook = song.book || '';
      return div;
    }

    // Helper: POST the full list of choruses for a week
    function postChorusList(weekIdx) {
      const chorusList = document.getElementById(`chorus-list-${weekIdx}`);
      const chorusRows = Array.from(chorusList.querySelectorAll('.chorus-row'));
      const choruses = chorusRows.map(div => {
        return {
          number: div.dataset.songnum || undefined,
          name: div.dataset.songname,
          book: div.dataset.songbook || undefined
        };
      });
      const [ year, month ] = document.getElementById( 'songMonthPicker' ).value.split( '-' ).map( Number );
      const sundays = getSundaysInMonth( year, month );
      const sunday = sundays[ weekIdx ];
      let date = '';
      if ( sunday ) {
        date = `${sunday.getFullYear()}${String( sunday.getMonth() + 1 ).padStart( 2, '0' )}${String( sunday.getDate() ).padStart( 2, '0' )}`;
      }
      fetch('/api/chorus-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weekIdx, slot: 'choruses', choruses, date })
      });
    }
    // --- END OF SONG SELECTION LOGIC ---
    // Initial render
    (function initSongSelectionTab() {
      renderMonthDropdown();
      document.getElementById('songMonthPicker').addEventListener('change', handleMonthChange);
      handleMonthChange();
      ensureSongSelectModal();
    })();
    // Month dropdown event
    function handleMonthChange() {
      const [year, month] = document.getElementById('songMonthPicker').value.split('-').map(Number);
      renderSongSelectionWeeks(year, month);
      fetchAndApplyWeekSelections(year, month); // <-- Load selections after rendering weeks
    }
    // Helper: get song label without file extension
    function songLabel(song) {
      // Remove file extension from name if present
      let name = song.name || '';
      // Remove trailing .pptx, .ppt, .lnk, .txt, .pdf, etc. (case-insensitive)
      name = name.replace(/\.(pptx?|lnk|txt|pdf)$/i, '');
      // Remove trailing ' - Shortcut' if present
      name = name.replace(/ - Shortcut$/i, '');
      // Remove leading/trailing whitespace
      name = name.trim();
      // Remove leading # from number if present
      let number = song.number || '';
      if (typeof number === 'string' && number.startsWith('#')) number = number.slice(1);
      // Only add # if number is present and not already in name
      let label = '';
      if (number) {
        label = `#${number} - ${name}`;
      } else {
        label = name;
      }
      return label;
    }
  </script>

  <script>
    function showSnackbar(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${type} border-0 show`;
      toast.role = 'alert';
      toast.ariaLive = 'assertive';
      toast.ariaAtomic = 'true';
      toast.style.minWidth = '220px';
      toast.style.fontSize = '1.1em';
      toast.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>`;
      document.getElementById('snackbar-container').appendChild(toast);
      setTimeout(() => { toast.classList.remove('show'); toast.remove(); }, 3500);
      toast.querySelector('.btn-close').onclick = () => toast.remove();
    }
  </script>
