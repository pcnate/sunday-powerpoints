<!-- Toolbar-style filter row -->
<div class="filter-bar">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <input matInput [(ngModel)]="searchText" (ngModelChange)="filterSongs()"
           placeholder="Search by name, number, or book...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="book-field" subscriptSizing="dynamic">
    <mat-select [(ngModel)]="selectedBook" (selectionChange)="filterSongs()">
      <mat-option value="">All Books/Sources ({{ songs.length }})</mat-option>
      <mat-option *ngFor="let b of books" [value]="b.name">
        <img *ngIf="b.icon" [src]="'/api/books/icons/' + b.icon" class="book-icon" alt="" />
        {{ b.name }} ({{ b.count }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <span class="spacer"></span>

  <button mat-flat-button color="primary" class="create-button" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    Create Song
  </button>
</div>

<!-- AG Grid -->
<div class="grid-container">
  <ag-grid-angular
    [theme]="gridTheme"
    [rowData]="filteredSongs"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [animateRows]="true"
    [enableCellTextSelection]="true"
    [ensureDomOrder]="true"
    [loading]="loading"
    [overlayNoRowsTemplate]="noRowsTemplate"
    (rowClicked)="onRowClicked( $event )"
    (gridReady)="onGridReady( $event )"
  />
</div>

<!-- Footer -->
<div class="grid-footer">
  <span>{{ filteredSongs.length }} of {{ songs.length }} songs</span>
</div>
