<!-- Template info -->
<mat-card class="info-card" appearance="outlined" *ngIf="templateInfo">
  <mat-card-content>
    <div class="info-row">
      <mat-icon>slideshow</mat-icon>
      <div>
        <div class="info-label">Template</div>
        <div class="info-value">{{ templateInfo.name }}</div>
      </div>
      <div>
        <div class="info-label">Last Modified</div>
        <div class="info-value">{{ templateInfo.lastModified }}</div>
      </div>
      <div>
        <div class="info-label">Size</div>
        <div class="info-value">{{ templateInfo.size }}</div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
