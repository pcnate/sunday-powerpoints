openapi: 3.0.3
info:
  title: Sunday PowerPoints API
  description: API for managing weekly church service PowerPoint presentations, songs, and the video processing job system.
  version: 0.0.0  # overridden at runtime from package.json

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Folders
    description: Sunday folder management
  - name: Songs
    description: Song library and selection
  - name: Notes
    description: Sermon notes
  - name: Admin
    description: Administrative operations
  - name: Jobs
    description: Job queue for video processing pipeline
  - name: Worker
    description: Endpoints used by the Rust worker to process jobs

paths:
  # --- Folders ---
  /api/folders:
    get:
      tags: [Folders]
      summary: List all Sunday folders
      description: Returns all YYYYMMDD folders found in the output directory with their metadata.
      responses:
        '200':
          description: Array of Sunday folder objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SundayFolder'

  /api/thumbnail/{folder}:
    get:
      tags: [Folders]
      summary: Get folder thumbnail
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
          description: YYYYMMDD folder name
      responses:
        '200':
          description: JPEG thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Thumbnail not found

  /api/template-info:
    get:
      tags: [Admin]
      summary: Get template file info
      responses:
        '200':
          description: Template file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  templateFile:
                    type: string
                  ext:
                    type: string

  # --- Songs ---
  /api/songs:
    get:
      tags: [Songs]
      summary: List all available songs
      description: Recursively walks the songs directory and returns all song files.
      responses:
        '200':
          description: Array of song objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SongFile'

  /api/songs/{id}/history:
    get:
      tags: [Songs]
      summary: Get song usage history by ID
      description: Returns song details and all dates the song was used, with slot information. Preferred over the name-based lookup.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Song primary key
      responses:
        '200':
          description: Song details with usage history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongHistoryResponse'
        '400':
          description: Invalid song ID
        '404':
          description: Song not found
        '503':
          description: Database not available

  /api/songs/history:
    get:
      tags: [Songs]
      summary: Get song usage history by name (legacy)
      description: Returns song details and all dates the song was used, with slot information. Uses tiered fuzzy matching by name. Prefer /api/songs/{id}/history when the song ID is known.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Song display name
        - name: number
          in: query
          schema:
            type: string
          description: Song number (e.g. "203")
        - name: book
          in: query
          schema:
            type: string
          description: Book/source folder name
      responses:
        '200':
          description: Song details with usage history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongHistoryResponse'
        '400':
          description: Missing required name parameter
        '503':
          description: Database not available

  /api/songs/create:
    post:
      tags: [Songs]
      summary: Create a new song file from template
      description: Copies the song template to the target book folder with proper naming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book, name]
              properties:
                book:
                  type: string
                  description: Book/source folder name
                name:
                  type: string
                  description: Song name
                number:
                  type: string
                  description: Optional song number
                ccli:
                  type: string
                  description: Optional CCLI license number
      responses:
        '200':
          description: Song created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  song:
                    $ref: '#/components/schemas/SongFile'
        '409':
          description: File already exists

  /api/books:
    get:
      tags: [Songs]
      summary: List enabled books
      description: Returns all enabled book/source categories from the database.
      responses:
        '200':
          description: Array of book objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
    post:
      tags: [Songs]
      summary: Create a new book
      description: Creates a new book/source category and its directory on disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Book created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  enabled:
                    type: boolean

  /api/week-song-selections:
    get:
      tags: [Songs]
      summary: Get song selections for a month
      description: >
        Returns song and chorus selections for each Sunday in the month,
        parsed from shortcut files and enriched with DB id and CCLI data.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: >
            Map of week index to selections. Each week has songs (keyed by slot)
            and choruses (array).
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    songs:
                      type: object
                      additionalProperties:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            description: Database song ID
                          name:
                            type: string
                          number:
                            type: string
                          shortcut:
                            type: string
                          ccli:
                            type: string
                    choruses:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Database song ID
                          name:
                            type: string
                          number:
                            type: string
                          shortcut:
                            type: string
                          ccli:
                            type: string

  /api/update-song:
    post:
      tags: [Songs]
      summary: Update song selection for a week
      description: >
        Creates a shortcut (.lnk) for the selected song and records the selection in the database.
        When song.id is provided, uses it directly for DB tracking. Otherwise falls back to fuzzy name matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot]
              properties:
                date:
                  type: string
                  pattern: '^\d{8}$'
                weekIdx:
                  type: integer
                slot:
                  type: string
                  description: 'Slot identifier: "1", "2", "3", or split variants like "2a", "2b"'
                  pattern: '^\d[a-z]?$'
                song:
                  type: object
                  nullable: true
                  description: Song to select (null to clear)
                  properties:
                    id:
                      type: integer
                      description: Database song ID (preferred — bypasses fuzzy matching)
                    name:
                      type: string
                    number:
                      type: string
                    book:
                      type: string
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
        '404':
          description: Song file not found in library

  /api/song-slot-split:
    post:
      tags: [Songs]
      summary: Split or unsplit a song slot
      description: |
        Split a base song slot into sub-slots (e.g., Song 2 → Song 2a, Song 2b)
        or unsplit back to a single slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, baseSlot, action]
              properties:
                date:
                  type: string
                  pattern: '^\d{8}$'
                baseSlot:
                  type: integer
                  enum: [1, 2, 3]
                action:
                  type: string
                  enum: [split, unsplit]
      responses:
        '200':
          description: Split result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  action:
                    type: string
                  baseSlot:
                    type: integer

  /api/chorus-update:
    post:
      tags: [Songs]
      summary: Update chorus selections for a week
      description: >
        Replaces all chorus shortcuts for a Sunday and records selections in the database.
        When chorus.id is provided, uses it directly for DB tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot, choruses]
              properties:
                date:
                  type: string
                  pattern: '^\d{8}$'
                weekIdx:
                  type: integer
                slot:
                  type: string
                  enum: [choruses]
                choruses:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Database song ID (preferred — bypasses fuzzy matching)
                      name:
                        type: string
                      number:
                        type: string
                      book:
                        type: string
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string

  # --- Notes ---
  /api/notes:
    get:
      tags: [Notes]
      summary: Get notes for a Sunday
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
      responses:
        '200':
          description: Notes content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
        '404':
          description: Notes not found
    post:
      tags: [Notes]
      summary: Update notes for a Sunday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, content]
              properties:
                date:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Notes saved

  # --- Admin ---
  /api/run-folders:
    post:
      tags: [Admin]
      summary: Create folders for a month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, year]
              properties:
                month:
                  type: integer
                year:
                  type: integer
                write:
                  type: boolean
      responses:
        '200':
          description: Result of folder creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/copy-template:
    post:
      tags: [Admin]
      summary: Copy template to all Sundays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, year]
              properties:
                month:
                  type: integer
                year:
                  type: integer
                write:
                  type: boolean
      responses:
        '200':
          description: Result of template copy

  /api/admin/backfill-songs:
    post:
      tags: [Admin]
      summary: Backfill song selections from existing folders
      description: >
        Scans all cached Sunday folders and syncs song/chorus/closing selections
        into the database. Idempotent — skips date+slot combinations that already
        have active records.
      responses:
        '200':
          description: Backfill result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  foldersScanned:
                    type: integer
                  selectionsRecorded:
                    type: integer
        '500':
          description: Backfill failed

  # --- Settings ---
  /api/settings/{key}:
    get:
      tags: [Admin]
      summary: Get a setting value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Setting key (e.g., "claude-prompt")
      responses:
        '200':
          description: Setting value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
        '404':
          description: Setting not found
        '503':
          description: Database not available
    put:
      tags: [Admin]
      summary: Update a setting value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Setting key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid value
        '503':
          description: Database not available

  # --- Jobs ---
  /api/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: Returns paginated, filterable list of jobs.
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated statuses (pending, queued, processing, completed, failed, cancelled)
        - name: type
          in: query
          schema:
            type: string
          description: Comma-separated types (transcription, claude-processing, transcode)
        - name: sunday_date
          in: query
          schema:
            type: string
            pattern: '^\d{8}$'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'

    post:
      tags: [Jobs]
      summary: Create a new job
      description: Creates a job. Rejects duplicates of the same type + sunday_date that are pending/queued/processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          description: Duplicate job exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  existing_id:
                    type: integer

  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job details
      description: Returns the full job record plus the latest 100 log entries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job with logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Job'
                  - type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobLog'
        '404':
          description: Job not found

    put:
      tags: [Jobs]
      summary: Update job
      description: Update priority or cancel a job. Only status change to "cancelled" is allowed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: integer
                  minimum: 1
                  maximum: 10
                status:
                  type: string
                  enum: [cancelled]
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /api/jobs/next:
    post:
      tags: [Worker]
      summary: Claim next available job
      description: Atomically claims the highest-priority pending job matching the requested types. Uses SELECT FOR UPDATE SKIP LOCKED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimJobRequest'
      responses:
        '200':
          description: Job claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '204':
          description: No jobs available

  /api/jobs/{id}/heartbeat:
    post:
      tags: [Worker]
      summary: Send heartbeat
      description: Worker sends periodic heartbeat while processing. Returns continue=false if job was cancelled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '403':
          description: Worker does not own this job

  /api/jobs/{id}/complete:
    post:
      tags: [Worker]
      summary: Mark job completed
      description: Worker marks job as completed. Triggers job chaining (transcription -> claude-processing).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
      responses:
        '200':
          description: Job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/jobs/{id}/fail:
    post:
      tags: [Worker]
      summary: Mark job failed
      description: Worker marks job as failed. Auto-retries if under max_retries, otherwise marks permanently failed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailJobRequest'
      responses:
        '200':
          description: Failure recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  will_retry:
                    type: boolean
                  retry_count:
                    type: integer

  /api/jobs/{id}/logs:
    post:
      tags: [Worker]
      summary: Send log entries
      description: Worker sends stdout/stderr log entries for a job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/JobLogEntry'
      responses:
        '200':
          description: Logs recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer

  /api/jobs/workers/events:
    get:
      tags: [Worker]
      summary: SSE stream for persistent worker connections
      description: |
        Server-Sent Events endpoint that maintains a persistent connection
        from a worker. Used to track worker online status (even when off-shift)
        and push job creation events. The server sends keepalive pings every
        30 seconds and broadcasts `job:created` events as they occur.
      parameters:
        - name: worker_id
          in: query
          required: true
          schema:
            type: string
          description: The worker's unique identifier
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of job types this worker handles
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE events in standard format:
                  - `connected` — sent on initial connection
                  - `job:created` — new job added to queue
                  - `:keepalive` — comment ping every 30s
        '400':
          description: Missing worker_id parameter

  # --- Presentation Approval ---
  /api/folders/{name}/approve:
    put:
      tags: [Folders]
      summary: Approve a presentation
      description: Renames the TODO .lnk shortcut in the template directory to remove "TODO", marking the presentation as approved.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: Approved or already approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  oldName:
                    type: string
                  newName:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid folder name
        '500':
          description: Failed to rename shortcut

  # --- Kdenlive Approval ---
  /api/folders/{name}/approve-kdenlive:
    post:
      tags: [Folders]
      summary: Approve Kdenlive project and queue transcode
      description: >
        Finds the .kdenlive file in the folder's Vids/ directory,
        creates a transcode job that will render it to YYYYMMDD-production.mp4.
        On transcode completion, a transcription job is automatically chained.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: Transcode job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  jobId:
                    type: integer
        '404':
          description: No Kdenlive project found
        '409':
          description: Production MP4 already exists or transcode job already queued

  /api/folders/{name}/archive:
    post:
      tags: [Folders]
      summary: Archive a Sunday folder
      description: >
        Moves OUTPUT_DIRECTORY/YYYYMMDD to OUTPUT_DIRECTORY/YYYY/YYYYMMDD.
        Returns 409 if the folder is already archived or does not exist at the root level.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: Folder archived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Missing or invalid folder name
        '404':
          description: Folder not found at root level
        '409':
          description: Folder is already archived or does not exist
        '500':
          description: Failed to move folder

  # --- YouTube URL ---
  /api/youtube-url:
    get:
      tags: [Folders]
      summary: Get YouTube URL for a Sunday
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: YouTube URL (may be null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    nullable: true
        '400':
          description: Missing folder parameter
        '500':
          description: Database error
    put:
      tags: [Folders]
      summary: Set or remove YouTube URL for a Sunday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: string
                  description: Folder name in YYYYMMDD format
                url:
                  type: string
                  description: YouTube URL (empty string to remove)
      responses:
        '200':
          description: URL saved or removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Missing folder parameter
        '500':
          description: Failed to save

  /api/sermon-pptx-files:
    get:
      tags: [Folders]
      summary: List sermon-eligible PPTX files in a Sunday folder
      description: Returns all .pptx files in the folder except the template copy (YYYYMMDD.pptx).
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: List of PPTX filenames
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string
        '400':
          description: Missing or invalid folder parameter

  /api/sermon-info:
    get:
      tags: [Folders]
      summary: Get sermon info for a Sunday
      parameters:
        - name: folder
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{8}$'
          description: Folder name in YYYYMMDD format
      responses:
        '200':
          description: Sermon info (fields may be null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  pptxFile:
                    type: string
                    nullable: true
                  title:
                    type: string
                    nullable: true
                  speaker:
                    type: string
                    nullable: true
        '400':
          description: Missing or invalid folder parameter
    put:
      tags: [Folders]
      summary: Set or clear sermon info for a Sunday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder:
                  type: string
                  description: Folder name in YYYYMMDD format
                pptxFile:
                  type: string
                  nullable: true
                  description: Selected sermon PPTX filename
                title:
                  type: string
                  nullable: true
                  description: Sermon title
                speaker:
                  type: string
                  nullable: true
                  description: Speaker name(s)
      responses:
        '200':
          description: Sermon info saved or cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Missing or invalid folder parameter
        '500':
          description: Failed to save

components:
  schemas:
    Job:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [transcription, claude-processing, transcode, ffprobe]
        status:
          type: string
          enum: [pending, queued, processing, completed, failed, cancelled]
        priority:
          type: integer
          minimum: 1
          maximum: 10
        sunday_date:
          type: string
          pattern: '^\d{8}$'
        input_path:
          type: string
        output_path:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        error_message:
          type: string
          nullable: true
        worker_id:
          type: string
          nullable: true
        retry_count:
          type: integer
        max_retries:
          type: integer
        parent_job_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        heartbeat_at:
          type: string
          format: date-time
          nullable: true

    JobLog:
      type: object
      properties:
        id:
          type: integer
        job_id:
          type: integer
        level:
          type: string
          enum: [info, warn, error, debug]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateJobRequest:
      type: object
      required: [type, sunday_date, input_path]
      properties:
        type:
          type: string
          enum: [transcription, claude-processing, transcode, ffprobe]
        sunday_date:
          type: string
          pattern: '^\d{8}$'
        input_path:
          type: string
        output_path:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        metadata:
          type: object
        parent_job_id:
          type: integer
        max_retries:
          type: integer
          default: 3

    ClaimJobRequest:
      type: object
      required: [worker_id, types]
      properties:
        worker_id:
          type: string
        types:
          type: array
          items:
            type: string
            enum: [transcription, claude-processing, transcode, ffprobe]

    HeartbeatRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
        progress:
          type: number
          minimum: 0
          maximum: 100

    HeartbeatResponse:
      type: object
      properties:
        continue:
          type: boolean

    CompleteJobRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
        output_path:
          type: string
        metadata:
          type: object

    FailJobRequest:
      type: object
      required: [worker_id, error_message]
      properties:
        worker_id:
          type: string
        error_message:
          type: string

    JobLogEntry:
      type: object
      required: [message]
      properties:
        level:
          type: string
          enum: [info, warn, error, debug]
          default: info
        message:
          type: string

    SundayFolder:
      type: object
      properties:
        name:
          type: string
          description: YYYYMMDD format
        path:
          type: string
        presentation:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        video:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              camera:
                type: string
              type:
                type: string
                enum: [mp4, mts]
        song1:
          $ref: '#/components/schemas/Song'
        song2:
          $ref: '#/components/schemas/Song'
        song3:
          $ref: '#/components/schemas/Song'
        choruses:
          type: array
          items:
            type: object
        hasNotes:
          type: string
          nullable: true
        archived:
          type: boolean
        backlog:
          type: boolean

    Song:
      type: object
      nullable: true
      properties:
        name:
          type: string
        prefix:
          type: string
        path:
          type: string
        target:
          type: string
        number:
          type: string
        book:
          type: string

    SongFile:
      type: object
      properties:
        id:
          type: integer
          description: Database song ID (present when DB is available)
        name:
          type: string
        number:
          type: string
        book:
          type: string
        bookIcon:
          type: string
          nullable: true
        filePath:
          type: string
        lastModified:
          type: string
        ccli:
          type: string
          nullable: true
        license:
          type: string
          nullable: true
        lastUsed:
          type: string
          description: YYYYMMDD of most recent usage
        totalUsed:
          type: integer

    SongHistoryResponse:
      type: object
      properties:
        name:
          type: string
        number:
          type: string
          nullable: true
        book:
          type: string
          nullable: true
        ccli:
          type: string
          nullable: true
        totalUsed:
          type: integer
        firstUsed:
          type: string
          nullable: true
        lastUsed:
          type: string
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/SongUsageEntry'

    SongUsageEntry:
      type: object
      properties:
        sundayDate:
          type: string
          description: YYYYMMDD or YYYYMM for closing songs
        slotType:
          type: string
          enum: [song, chorus, closing]
        slotNumber:
          type: integer
        slotSuffix:
          type: string
          nullable: true
